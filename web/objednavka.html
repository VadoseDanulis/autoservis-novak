<h1>Autoservis Novák – objednávka</h1>
<p>Vyplňte formulář a my se vám ozveme s potvrzením termínu.</p>
<form action="mailto:info@servis-novak.cz" method="post" enctype="text/plain">
  <p>
    <label for="jmeno">Jméno a příjmení</label><br>
    <input type="text" id="jmeno" name="jmeno" required>
  </p>
  <p>
    <label for="telefon">Telefon</label><br>
    <input type="tel" id="telefon" name="telefon" required>
  </p>
  <p>
    <label for="email">E-mail</label><br>
    <input type="email" id="email" name="email" required>
  </p>
  <p>
    <label for="auto">Značka a model auta</label><br>
    <input type="text" id="auto" name="auto" required>
  </p>
  <p>
    <label for="sluzba">Služba</label><br>
    <select id="sluzba" name="sluzba" required>
      <option value="">– vyberte –</option>
      <option>Výměna oleje a filtru</option>
      <option>Přezutí pneumatik</option>
      <option>Výměna brzdových destiček</option>
      <option>Diagnostika motoru</option>
      <option>Příprava na STK</option>
      <option>Geometrie kol</option>
      <option>Jiné</option>
    </select>
  </p>
  <p>
    <label for="datum">Požadovaný termín</label><br>
    <input type="date" id="datum" name="datum" required>
  </p>
  <p>
    <label for="poznamka">Poznámka</label><br>
    <textarea id="poznamka" name="poznamka" rows="4" cols="40"></textarea>
  </p>
  <p><button type="submit" class="tlacitko">Odeslat objednávku</button></p>
</form>
<footer>© 2026 · web vytvořil Dan</footer>
</body>
